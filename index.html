<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f5">
  <title>люблю.хамзата ♡</title>
  <style>
    :root {
      --pink: #f4cbd6;
      --pink-dark: #d88fa6;
      --cream: #fff9f4;
      --lavender: #e8e0f6;
      --ink: #6f5662;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; overflow: hidden;
      background: radial-gradient(circle at 15% 15%, #fffdf8 0, transparent 35%),
                  linear-gradient(145deg, #fff1f5, #f5efff 55%, #fff6e9);
      color: var(--ink); font-family: "Trebuchet MS", system-ui, sans-serif;
    }
    .card {
      width: min(100%, 520px); text-align: center; position: relative;
      padding: 38px 24px 34px; border: 1px solid #ffffffc9; border-radius: 30px;
      background: #ffffffb8; box-shadow: 0 20px 60px #b58ba51c;
      backdrop-filter: blur(8px);
    }
    .sparkle { position: absolute; color: #dba5b9; font-size: 22px; }
    .s1 { top: 20px; left: 25px; } .s2 { top: 42px; right: 30px; }
    .s3 { bottom: 26px; left: 35px; } .s4 { bottom: 22px; right: 35px; }
    .cat { width: 178px; height: 160px; margin: 0 auto 12px; display: block; }
    h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin: 8px 0 10px; font-weight: 700; letter-spacing: -.8px; }
    .sub { margin: 0 0 28px; font-size: 15px; color: #a58a98; }
    .buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: 54px; }
    button {
      border: 0; border-radius: 999px; padding: 13px 28px; font: inherit;
      font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .18s, box-shadow .18s;
      box-shadow: 0 6px 16px #b58ba51c;
    }
    button:focus-visible { outline: 3px solid #b18ac9; outline-offset: 3px; }
    #yes { background: var(--pink); color: #744b5c; }
    #yes:hover { transform: translateY(-2px); box-shadow: 0 9px 18px #d88fa633; }
    #no { background: var(--lavender); color: #75658d; position: relative; }
    .message { display: none; margin: 24px auto 0; padding: 15px 18px; max-width: 340px; border-radius: 18px; background: #fff7fb; color: #946779; line-height: 1.5; }
    .message.show { display: block; animation: pop .35s ease both; }
    .heart { position: fixed; pointer-events: none; font-size: 18px; animation: float 1.5s ease-out forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { from { opacity: 1; transform: translateY(0) scale(.7) rotate(0); } to { opacity: 0; transform: translateY(-110px) scale(1.3) rotate(18deg); } }
    @media (max-width: 420px) { .card { padding: 32px 18px; } .cat { width: 154px; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="sparkle s1">✦</span><span class="sparkle s2">♡</span>
    <span class="sparkle s3">✧</span><span class="sparkle s4">♡</span>
    <svg class="cat" viewBox="0 0 200 175" role="img" aria-label="Плачущий котик">
      <defs>
        <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf6"/><stop offset="1" stop-color="#eadfe5"/></linearGradient>
        <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9e7fa"/><stop offset="1" stop-color="#80c8ed"/></linearGradient>
      </defs>
      <ellipse cx="100" cy="158" rx="58" ry="8" fill="#e7d7e4" opacity=".5"/>
      <path d="M48 73 L39 24 Q38 17 46 23 L76 45 Q100 35 124 45 L154 23 Q162 17 161 25 L152 75" fill="url(#fur)" stroke="#d7c4d1" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="100" cy="95" rx="62" ry="58" fill="url(#fur)" stroke="#d7c4d1" stroke-width="3"/>
      <path d="M48 61 Q57 43 75 48" fill="none" stroke="#d8c5d1" stroke-width="3" stroke-linecap="round"/>
      <path d="M125 48 Q144 44 151 62" fill="none" stroke="#d8c5d1" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="76" cy="85" rx="7" ry="10" fill="#746171"/><ellipse cx="124" cy="85" rx="7" ry="10" fill="#746171"/>
      <path d="M66 72 Q76 65 85 73 M115 73 Q124 65 134 72" fill="none" stroke="#b99bab" stroke-width="3" stroke-linecap="round"/>
      <path d="M94 99 Q100 105 106 99 Q101 111 94 99" fill="#d98da8"/>
      <path d="M100 109 Q91 119 84 110 M100 109 Q109 119 116 110" fill="none" stroke="#9b7d90" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="61" cy="104" rx="12" ry="7" fill="#efbdcb" opacity=".7"/><ellipse cx="139" cy="104" rx="12" ry="7" fill="#efbdcb" opacity=".7"/>
      <path d="M70 96 C61 105 63 117 70 122 C78 117 79 105 70 96Z" fill="url(#tear)"/>
      <path d="M130 96 C121 105 123 117 130 122 C138 117 139 105 130 96Z" fill="url(#tear)"/>
      <path d="M70 123 Q67 130 72 132" fill="none" stroke="#80c8ed" stroke-width="2" stroke-linecap="round"/>
      <path d="M130 123 Q127 130 132 132" fill="none" stroke="#80c8ed" stroke-width="2" stroke-linecap="round"/>
      <path d="M44 98 L20 94 M45 108 L22 112 M156 98 L180 94 M155 108 L178 112" stroke="#c9b4c4" stroke-width="2" stroke-linecap="round"/>
      <path d="M88 144 Q100 135 112 144" fill="none" stroke="#d8c5d1" stroke-width="3" stroke-linecap="round"/>
      <path d="M89 142 L89 153 M111 142 L111 153" stroke="#d8c5d1" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>ты простишь меня?</h1>
    <p class="sub">я очень надеюсь на это… ♡</p>
    <div class="buttons">
      <button id="yes" type="button">да, прощу ♡</button>
      <button id="no" type="button">нет</button>
    </div>
    <div class="message" id="message" role="status">спасибо… ты даже не представляешь, как много это для меня значит 🥹💗</div>
  </main>
  <script>
    const no = document.getElementById('no');
    const yes = document.getElementById('yes');
    const message = document.getElementById('message');
    let escapes = 0;
    function runAway() {
      escapes++;
      no.style.position = 'fixed';
      const pad = 18;
      const maxX = Math.max(pad, window.innerWidth - no.offsetWidth - pad);
      const maxY = Math.max(pad, window.innerHeight - no.offsetHeight - pad);
      no.style.left = (pad + Math.random() * (maxX - pad)) + 'px';
      no.style.top = (pad + Math.random() * (maxY - pad)) + 'px';
      no.style.zIndex = '10';
      no.textContent = escapes > 3 ? 'ну пожааалуйста 🥺' : 'нет';
    }
    no.addEventListener('pointerenter', runAway);
    no.addEventListener('click', runAway);
    no.addEventListener('touchstart', e => { e.preventDefault(); runAway(); }, {passive:false});
    yes.addEventListener('click', () => {
      message.classList.add('show');
      for (let i = 0; i < 18; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart'; heart.textContent = ['♡','💗','💕','✧'][i % 4];
        heart.style.left = (10 + Math.random() * 80) + 'vw';
        heart.style.top = (45 + Math.random() * 40) + 'vh';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1600);
      }
      no.style.display = 'none';
      yes.textContent = 'обнимаю ♡';
    });
  </script>
</body>
</html>
